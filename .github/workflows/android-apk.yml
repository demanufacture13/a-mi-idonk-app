name: A MI IDŐNK - Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Kiadás verziója (például v1.0.0); üresen csak APK készül'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt letöltése
        uses: actions/checkout@v4

      - name: Java telepítése
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter telepítése
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter projekt előkészítése
        working-directory: amiidonk_apk_build
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Alkalmazás nevének beállítása
        working-directory: amiidonk_apk_build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="A MI IDŐNK"', s, count=1)
          p.write_text(s)
          PY

      - name: Alkalmazásikon elkészítése
        working-directory: amiidonk_apk_build
        run: dart run flutter_launcher_icons

      - name: Firebase konfiguráció hozzáadása
        working-directory: amiidonk_apk_build
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          printf '%s' "$FIREBASE_CONFIG" > android/app/google-services.json

      - name: Internetengedély hozzáadása
        working-directory: amiidonk_apk_build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace("<application", permission + "\n    <application", 1)
          p.write_text(s)
          PY

      - name: Háttérlejátszás Android-engedélyei
        working-directory: amiidonk_apk_build
        run: |
          python3 - <<'PYMANIFEST'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for permission in (
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.WAKE_LOCK',
              'android.permission.POST_NOTIFICATIONS',
          ):
              line = f'<uses-permission android:name="{permission}" />'
              if permission not in s:
                  s = s.replace('<application', line + '\n    <application', 1)
          service = ('<service android:name="id.flutter.flutter_background_service.BackgroundService" '
                     'android:foregroundServiceType="mediaPlayback" '
