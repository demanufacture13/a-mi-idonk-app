
name: A MI IDŐNK - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt letöltése
        uses: actions/checkout@v4

      - name: Java telepítése
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter telepítése
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter projekt előkészítése
        working-directory: amiidonk_apk_build
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Alkalmazásikon elkészítése
        working-directory: amiidonk_apk_build
        run: dart run flutter_launcher_icons

      - name: Firebase konfiguráció hozzáadása
        working-directory: amiidonk_apk_build
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          printf '%s' "$FIREBASE_CONFIG" > android/app/google-services.json

      - name: Internetengedély hozzáadása
        working-directory: amiidonk_apk_build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace(
                  "<application",
                  permission + "\n    <application",
                  1
              )

          p.write_text(s)
          PY

      - name: Értesítési ikon elkészítése
        working-directory: amiidonk_apk_build
        run: |
          python3 -m pip install --quiet pillow

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter

          source = Path("d48ef3fd-9f5d-44e5-a624-14270c81535b.png")

          if not source.exists():
              raise SystemExit(
                  "Nem található az alkalmazásikon: " + str(source)
              )

          image = Image.open(source).convert("RGBA")
          image = ImageOps.fit(image, (256, 256))

          # A háttértől elkülönülő logómaszk.
          pixels = image.load()
          background = pixels[0, 0][:3]

          mask = Image.new("L", image.size, 0)
          output = mask.load()

          for y in range(image.height):
              for x in range(image.width):
                  r, g, b, a = pixels[x, y]
                  distance = max(
                      abs(r - background[0]),
                      abs(g - background[1]),
                      abs(b - background[2])
                  )
                  output[x, y] = 255 if a > 80 and distance > 65 else 0

          mask = mask.filter(ImageFilter.GaussianBlur(0.4))

          sizes = {
              "drawable-mdpi": 24,
              "drawable-hdpi": 36,
              "drawable-xhdpi": 48,
              "drawable-xxhdpi": 72,
              "drawable-xxxhdpi": 96,
          }

          for folder, size in sizes.items():
              destination = Path("android/app/src/main/res") / folder
              destination.mkdir(parents=True, exist_ok=True)

              resized = mask.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon = Image.new("RGBA", (size, size), (255, 255, 255, 0))
              icon.putalpha(resized)
              icon.save(destination / "ic_stat_amiidonk.png")

          print("Értesítési ikonok elkészültek.")
          PY

      - name: Értesítési ikon beállítása
        working-directory: amiidonk_apk_build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          metadata = '''
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_icon"
                  android:resource="@drawable/ic_stat_amiidonk" />
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_color"
                  android:resource="@color/notification_red" />
          '''

          if "com.google.firebase.messaging.default_notification_icon" not in s:
              s = s.replace(
                  "<application",
                  "<application",
                  1
              )
              position = s.find(">", s.find("<application"))
              if position == -1:
                  raise SystemExit("Az application elem nem található.")
              s = s[:position + 1] + metadata + s[position + 1:]

          p.write_text(s)

          colors = Path("android/app/src/main/res/values/colors.xml")
          colors.parent.mkdir(parents=True, exist_ok=True)
          colors.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="notification_red">#D20A12</color>\n'
              '</resources>\n'
          )
          PY

      - name: Firebase Android plugin beállítása
        working-directory: amiidonk_apk_build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()

          plugin = 'id("com.google.gms.google-services") version "4.4.4" apply false'

          if plugin not in s:
              s = s.replace(
                  'plugins {',
                  'plugins {\n    ' + plugin,
                  1
              )

          settings.write_text(s)

          app = Path("android/app/build.gradle.kts")
          s = app.read_text()

          plugin = 'id("com.google.gms.google-services")'

          if plugin not in s:
              s = s.replace(
                  'plugins {',
                  'plugins {\n    ' + plugin,
                  1
              )

          app.write_text(s)
          PY

      - name: APK elkészítése
        working-directory: amiidonk_apk_build
        run: flutter build apk --release

      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: A_MI_IDONK_Redmi_Pad_2_APK
          path: amiidonk_apk_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
