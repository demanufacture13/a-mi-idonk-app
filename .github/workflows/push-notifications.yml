
name: A MI IDŐNK - Push értesítések

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amiidonk-push-notifications
  cancel-in-progress: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Firebase telepítése
        run: pip install firebase-admin

      - name: Új cikkek ellenőrzése
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/send_notifications.py

      - name: Utolsó feldolgozott cikk mentése
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/last_post.json
          if ! git diff --cached --quiet; then
            git commit -m "Értesítések állapotának frissítése"
            git push
          fi
